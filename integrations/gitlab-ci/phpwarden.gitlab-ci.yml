# phpwarden — scan composer.lock in GitLab CI, ranked by real-world exploitation.
#
# Findings are ordered CISA KEV (actually being exploited) first, then EPSS
# probability, then CVSS — of the ~21,100 PHP advisories in the feed, 43 are
# in KEV (as of 2026-11-12), and those are what this job surfaces at the top.
#
# Usage: copy this job into your .gitlab-ci.yml, or include it:
#
#   include:
#     - remote: https://raw.githubusercontent.com/oroma-alfred/phpwarden/main/integrations/gitlab-ci/phpwarden.gitlab-ci.yml
#
# The job fails only when phpwarden finds something (CLI exit 1 "vulnerable"
# or 2 "possibly exposed"). Other exit codes — 4 bad lockfile, 5 report upload
# failed, 64 usage error — fail the job too, loudly, because they mean the scan
# did not happen as configured. Full exit-code table: `phpwarden --help`.
# (The CLI has no severity threshold: exit 1 means any known-vulnerable
# package. For a KEV-only gate use the GitHub Action's `fail-on: exploited`, or
# filter the `known_exploited` field of phpwarden.json in a follow-up step.)
#
# Dashboard: set PHPWARDEN_REPORT_TO and a masked PHPWARDEN_REPORT_TOKEN and
# every run is also posted to app.phpwarden.io — the equivalent of
#   phpwarden deps composer.lock --report-to https://app.phpwarden.io/v1/reports --report-token <token>

phpwarden:
  stage: test
  image: python:3.12-slim
  variables:
    PHPWARDEN_LOCKFILE: composer.lock
    # Optional: forward results to your phpwarden dashboard. Set the token as a
    # masked CI/CD variable (Settings > CI/CD > Variables), never in this file.
    # PHPWARDEN_REPORT_TO: https://app.phpwarden.io/v1/reports
    # PHPWARDEN_REPORT_TOKEN: $PHPWARDEN_TOKEN    # the CLI reads this env var itself
  before_script:
    - pip install --quiet --disable-pip-version-check "phpwarden>=2,<3"
    - phpwarden --version
  script:
    # Machine-readable copy first (kept as an artifact), then the human report.
    # `|| true` here only defers the verdict: the second run decides the job.
    - phpwarden deps "$PHPWARDEN_LOCKFILE" --json > phpwarden.json || true
    - |
      set +e
      if [ -n "$PHPWARDEN_REPORT_TO" ]; then
        phpwarden deps "$PHPWARDEN_LOCKFILE" --report-to "$PHPWARDEN_REPORT_TO"
      else
        phpwarden deps "$PHPWARDEN_LOCKFILE"
      fi
      rc=$?
      set -e
      case "$rc" in
        0) echo "phpwarden: clean" ;;
        1) echo "phpwarden: vulnerable packages found (exit 1)" ;;
        2) echo "phpwarden: possibly exposed (exit 2)" ;;
        *) echo "phpwarden: scan did not complete (exit $rc) — see output above" ;;
      esac
      exit $rc
  allow_failure: false
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - phpwarden.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
