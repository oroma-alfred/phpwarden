# phpwarden — scan composer.lock for known-vulnerable packages in GitLab CI.
#
# Usage: copy this job into your .gitlab-ci.yml, or include it:
#
#   include:
#     - remote: https://raw.githubusercontent.com/primeagent001-bot/phpwarden/main/integrations/gitlab-ci/phpwarden.gitlab-ci.yml
#
# The job fails only when phpwarden finds something (CLI exit 1 "vulnerable"
# or 2 "possibly exposed"). Other exit codes — 4 bad lockfile, 5 report upload
# failed, 64 usage error — fail the job too, loudly, because they mean the scan
# did not happen as configured. Full exit-code table: `phpwarden --help`.

phpwarden:
  stage: test
  image: python:3.12-slim
  variables:
    PHPWARDEN_LOCKFILE: composer.lock
    # Optional: forward results to your phpwarden dashboard. Set the token as a
    # masked CI/CD variable (Settings > CI/CD > Variables), never in this file.
    # PHPWARDEN_REPORT_TO: https://app.phpwarden.io/v1/reports
    # PHPWARDEN_REPORT_TOKEN: $PHPWARDEN_TOKEN
  before_script:
    - pip install --quiet --disable-pip-version-check "phpwarden>=2,<3"
    - phpwarden --version
  script:
    # Machine-readable copy first (kept as an artifact), then the human report.
    # `|| true` here only defers the verdict: the second run decides the job.
    - phpwarden deps "$PHPWARDEN_LOCKFILE" --json > phpwarden.json || true
    - |
      set +e
      if [ -n "$PHPWARDEN_REPORT_TO" ]; then
        phpwarden deps "$PHPWARDEN_LOCKFILE" --report-to "$PHPWARDEN_REPORT_TO"
      else
        phpwarden deps "$PHPWARDEN_LOCKFILE"
      fi
      rc=$?
      set -e
      case "$rc" in
        0) echo "phpwarden: clean" ;;
        1) echo "phpwarden: vulnerable packages found (exit 1)" ;;
        2) echo "phpwarden: possibly exposed (exit 2)" ;;
        *) echo "phpwarden: scan did not complete (exit $rc) — see output above" ;;
      esac
      exit $rc
  allow_failure: false
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - phpwarden.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
