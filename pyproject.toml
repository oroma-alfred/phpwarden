[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phpwarden"
version = "2.1.1"
description = "PHP vulnerability scanner for Composer, WordPress and the PHP engine — findings ranked by real-world exploitation (CISA KEV, then EPSS), not CVSS. Offline, zero deps."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "oroma-alfred" }]
keywords = ["php", "composer", "wordpress", "php-fpm", "security", "vulnerability", "cve", "kev", "epss", "sca", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = []       # stdlib only

[project.urls]
Homepage = "https://phpwarden.io"
Source = "https://github.com/oroma-alfred/phpwarden"
Issues = "https://github.com/oroma-alfred/phpwarden/issues"

[project.scripts]
phpwarden = "phpwarden.cli:main"
phpwarden-guard = "phpwarden.guard:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phpwarden = ["data/*.json"]
